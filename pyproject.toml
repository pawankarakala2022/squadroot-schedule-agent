[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squadroot-schedule-agent"
version = "6.0.0"
description = "Club operations scheduling agent for sports clubs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["httpx", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
app = ["fastapi", "uvicorn", "python-multipart"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["schedule_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
